<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table,th,td
        {
            border-collapse: collapse;
            padding: 40px;
            background-color: black;
            color: gold;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and Tables</title>
</head>
<body>
    <table border="1">
    <!-- Caption tag - Used to name or add a heading to a table -->
    <!-- tr - Used to specify rows -->
    <!-- th - Used to specify headers -->
    <!-- td - Used to specify table data -->
        <caption>September-December 2026 Timetable</caption>
        <tr>
            <th></th>
            <th>8-11</th>
            <th>11-2</th>
            <th>2-5</th>
        </tr>
        <tr>
            <th>MON</th>
            <td>MAT 111</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <th>TUE</th>
            <td>GS 101</td>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <th>WED</th>
            <td>CMT 101</td>
            <td></td>
            <td>CMT 108</td>
        </tr>
        <tr>
            <th>THUR</th>
            <!-- colspan attribute - Used to merge cells on a table -->
            <td colspan="3">FREE DAY</td>

        </tr>
        <tr>
            <th>FRI</th>
            <td></td>
            <td>CMT 102</td>
            <td></td>
        </tr>
    </table>
</body>
</html>
