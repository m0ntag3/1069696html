<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and Formatting Tags</title>
</head>
<body>
    <!-- Boldens typed text -->
    <p><b>This paragraph is bold</b></p>
    <!-- Underlines typed text -->
    <p><u>This paragraph is underlined</u></p>
    <!-- Italicizes typed text -->
    <p><i>This paragraph is italics</i></p>
    <!-- mark - highlights the words typed in between -->
    <p><mark>HTML, CSS and Javascript</mark> are the pillars of web programming</p>
    <!-- Strikes typed text -->
    <p><del>Old price: was Ksh.40,000</del> New price: is Ksh.35,000</p>
    <!-- Superscripts -->
    <p>Today's date: 30<sup>th</sup> September 2026</p>
    <!-- Subscripts -->
    <p> I love to drink H<sub>2</sub>O</p>
</body>
</html>
