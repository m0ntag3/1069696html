<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and Lists</title>
</head>
<body>
    <!-- Unordered Lists -->
    <!-- Types of bullets used are disc(default), square, circle or none -->
    <ul type="circle">Fruits
        <li>Oranges</li>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Mangoes</li>
        <li>Grapes</li>    
    </ul>
    <hr>
    <p>The Big Five in Kenya</p>
    <ol type="a" start="4">
        <li>Lion</li>
        <li>Elephant</li>
        <li>Rhino</li>
        <li>Buffalo</li>
        <li>Leopard</li>
    </ol>
    <hr>
    <dl>
        <dt>Data</dt>
        <dd>Raw facts</dd>
        <dt>Information</dt>
        <dd>Processed data</dd>
        <dt>Computer Networks</dt>
        <dd>Global connection of computers</dd>
    </dl>
</body>
</html>
