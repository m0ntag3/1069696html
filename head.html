<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body{
            background-color: rgb(43, 42, 42);
            color: rgb(141, 110, 110);
        }
    </style>
    <!-- Meta - data bout a particular page  -->
    <meta charset="UTF-8">
    <!-- meta tag with attribute name is used to specify data on a particular web page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Joe Doe, Mike">
    <meta name="Description" content="HTML, CSS, Javascript, Client Side scripting">
    <meta name="keywords" content="Web Development, Client Side scripting">
    <!-- meta tag with attribute http-equiv is used to specify refreshrate of the web page -->
    <meta http-equiv="refresh" content="10">
    <base="http://www.cuea.edu/" target="_blank"
    <title>HTML and Header Tags</title>
    <script>
        function myFunction()
        {
            document.getElementById('welcome').innerHTML="Welcome to student portal";
        }
    </script>
</head>
<body onload="myFunction()">
    <a href="index.html">Index page</a>
    <h2>Welcome</h2>
    <p id="welcome">Welcome to my website</p>
</body>
</html>
