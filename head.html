<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body{
            background-color: rgb(43, 42, 42);
            color: rgb(141, 110, 110);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and Header Tags</title>
    <script>
        function myFunction()
        {
            document.getElementById('welcome').innerHTML="Welcome to student portal";
        }
    </script>
</head>
<body onload="myFunction()">
    <h2>Welcome</h2>
    <p id="welcome">Welcome to my website</p>
</body>
</html>
