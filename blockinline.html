<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div
        {
            background-color: rgb(91, 80, 80);
            color: gold;
            font-size: 40px;
            border: 5px solid maroon;
            border-radius: 5px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV and span tags in HTML</title>
</head>
<body>
    <div>Div One</div> 
    <div>Div Two</div>
    <span style="background-color: rgb(97, 42, 42);color: tomato;">Example using a span element</span>
</body>
</html>
